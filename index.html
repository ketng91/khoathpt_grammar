<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vườn Trắc nghiệm Tiếng Anh - Lớp Anh thầy Kết</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* {
  box-sizing: border-box;
  font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
}

:root {
  --apple-red: #ff4757;
  --apple-dark-red: #ee5253;
  --apple-pink: #ff6b81;
  --pastel-green-bg: #eef9f1;
  --farm-green: #2ed573;
  --farm-dark-green: #26af5f;
  --text-dark: #2d3436;
  --shadow-soft: 0 10px 25px rgba(0, 0, 0, 0.06);
}

body {
  background-color: var(--pastel-green-bg);
  background-image: linear-gradient(180deg, #e4f5e8 0%, #f4fbf6 100%);
  margin: 0;
  padding: 0;
  text-align: center;
  color: var(--text-dark);
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

/* Hiệu ứng Động Nông Trại Vườn Táo */
.farm-bg-element {
  position: fixed;
  pointer-events: none;
  z-index: 0;
  opacity: 0.85;
}

.floating-apple-1 {
  top: 8%; left: 3%;
  font-size: 42px;
  animation: floatSlow 6s ease-in-out infinite alternate;
}

.floating-apple-2 {
  top: 65%; right: 4%;
  font-size: 50px;
  animation: floatSlow 8s ease-in-out infinite alternate-reverse;
}

.floating-leaf-1 {
  top: 25%; right: 6%;
  font-size: 36px;
  color: #2ed573;
  animation: rotateLeaf 12s linear infinite;
}

.floating-leaf-2 {
  bottom: 12%; left: 4%;
  font-size: 40px;
  color: #7bed9f;
  animation: rotateLeaf 15s linear infinite reverse;
}

@keyframes floatSlow {
  0% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-18px) rotate(8deg); }
  100% { transform: translateY(10px) rotate(-6deg); }
}

@keyframes rotateLeaf {
  0% { transform: rotate(0deg) scale(1); }
  50% { transform: rotate(180deg) scale(1.1); }
  100% { transform: rotate(360deg) scale(1); }
}

header {
  background: linear-gradient(135deg, #ff4757, #ff6b81);
  padding: 16px 24px;
  font-weight: 800;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3);
  border-bottom: 4px solid #ee5253;
  z-index: 10;
}

.header-left { position: static; left: 20px; }
.header-left a {
  display: flex; align-items: center; gap: 8px;
  font-size: 18px; color: #fff; text-decoration: none;
  background: rgba(255, 255, 255, 0.25);
  padding: 6px 16px;
  border-radius: 25px;
  font-weight: 700;
  transition: all 0.3s ease;
}
.header-left a:hover {
  background: #fff;
  color: var(--apple-red);
}

.header-center { 
  font-size: 24px; 
  font-weight: 900;
  letter-spacing: 0.5px;
  text-shadow: 1px 2px 4px rgba(0,0,0,0.15);
}

.farm-controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
  margin: 24px auto 12px auto;
  max-width: 950px;
  padding: 0 15px;
  position: relative;
  z-index: 5;
}

.select-wood-box {
  background: linear-gradient(135deg, #8d6e63, #6d4c41);
  padding: 8px 18px;
  border-radius: 16px;
  border: 2px solid #5d4037;
  box-shadow: 0 4px 10px rgba(0,0,0,0.12);
  display: flex;
  align-items: center;
  gap: 10px;
  color: #fff;
  font-weight: 800;
  font-size: 16px;
}

select {
  padding: 8px 14px; 
  font-size: 16px;
  font-weight: 700;
  border-radius: 10px; 
  border: 2px solid #ff8a80;
  background-color: #fff;
  color: #c62828;
  cursor: pointer;
  outline: none;
  max-width: 320px;
}

#timerBox { 
  margin: 8px auto 18px auto; 
  font-size: 20px; 
  font-weight: 800;
  background: #ffffff;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 24px;
  border-radius: 30px;
  border: 2px solid #ffcdd2;
  color: var(--apple-red);
  box-shadow: 0 4px 12px rgba(255, 71, 87, 0.1);
  position: relative;
  z-index: 5;
}

#timerBox button {
  padding: 4px 14px; 
  font-size: 14px;
  font-weight: 800;
  border-radius: 20px; 
  border: none; 
  cursor: pointer; 
  background-color: #ff6b81;
  color: #fff;
  transition: 0.2s ease;
}
#timerBox button:hover { background-color: var(--apple-red); }

.exercise { 
  width: 90%; 
  max-width: 880px;
  margin: 0 auto 30px auto; 
  text-align: left; 
  position: relative;
  z-index: 5;
}

.question-block {
  background: #ffffff;
  border-radius: 24px;
  padding: 30px;
  border: 3px solid #ffcdd2;
  box-shadow: var(--shadow-soft);
  position: relative;
}

.set-badge-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
  font-size: 15px;
  font-weight: 800;
  color: #c62828;
  background: #ffebee;
  padding: 8px 16px;
  border-radius: 12px;
}

.question-box {
  width: 100%; 
  min-height: 60px; 
  border-radius: 16px; 
  padding: 18px; 
  margin-bottom: 20px;
  font-size: 21px; 
  font-weight: 800; 
  background-color: #fff5f5;
  border: 2px dashed #ff8a80;
  color: #b71c1c;
  line-height: 1.5;
}

.option-row { 
  display: flex; 
  align-items: center;
  margin: 12px 0; 
  gap: 12px;
  background: #ffffff;
  padding: 10px 16px;
  border-radius: 14px;
  border: 2px solid #f0f0f0;
  transition: all 0.2s ease;
}

.option-row:hover {
  border-color: #ff8a80;
  background: #fffafa;
}

.option-row.correct-choice {
  background: #e8f5e9 !important;
  border-color: #66bb6a !important;
}

.option-row.wrong-choice {
  background: #ffebee !important;
  border-color: #ef5350 !important;
}

.option-row input[type="radio"] { 
  transform: scale(1.3);
  accent-color: var(--apple-red);
  cursor: pointer;
}

.option-row label {
  flex: 1;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  color: var(--text-dark);
}

.note-small {
  width: 240px;
  height: 36px;
  padding: 6px 10px;
  font-size: 14px;
  color: #c62828;
  background-color: #fffde7;
  border: 1px solid #fff59d;
  border-radius: 8px;
  resize: none;
  box-sizing: border-box;
}

.review-explanation {
  margin-top: 15px;
  padding: 14px 18px;
  background-color: #e8f5e9;
  border-left: 5px solid #2e7d32;
  border-radius: 8px;
  color: #1b5e20;
  font-size: 16px;
  font-weight: 700;
  line-height: 1.5;
}

.exercise-buttons { 
  margin-top: 25px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.exercise-buttons button {
  padding: 12px 24px; 
  font-size: 17px;
  font-weight: 800;
  border-radius: 14px; 
  border: none; 
  cursor: pointer;
  color: white;
  transition: all 0.2s ease;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.exercise-buttons button:hover {
  transform: translateY(-2px);
}

.btn-submit { background-color: #2ed573; }
.btn-submit:hover { background-color: #26af5f; }

.btn-next { background-color: #ff4757; }
.btn-next:hover { background-color: #ee5253; }

.btn-back { background-color: #ffa502; }
.btn-back:hover { background-color: #eccc68; }

.promo-text {
  margin-left: auto;
  font-weight: 800;
  font-size: 15px;
  color: #c62828;
  background: #ffebee;
  padding: 8px 16px;
  border-radius: 20px;
  border: 1px solid #ffcdd2;
}

.score-card {
  text-align: center;
  padding: 40px 20px;
  background: #ffffff;
  border-radius: 24px;
  border: 3px solid #ffcdd2;
  box-shadow: var(--shadow-soft);
}

.score-card h2 {
  font-size: 32px;
  font-weight: 900;
  color: var(--apple-red);
  margin-bottom: 10px;
}

.score-number {
  font-size: 64px;
  font-weight: 900;
  color: #2ed573;
  margin: 15px 0;
}

.note-large {
  width: 90%;
  max-width: 880px;
  min-height: 90px;
  padding: 14px;
  font-size: 17px;
  font-weight: 700;
  color: #2e7d32;
  background-color: #ffffff;
  border: 2px solid #a5d6a7;
  border-radius: 18px;
  resize: vertical;
  margin: 10px auto 40px auto;
  box-shadow: var(--shadow-soft);
  position: relative;
  z-index: 5;
}

footer {
  background: linear-gradient(135deg, #ff4757, #ff6b81);
  color: white;
  padding: 14px;
  font-weight: 800;
  font-size: 17px;
  border-top: 4px solid #ee5253;
  position: relative;
  z-index: 10;
}

@media (max-width: 768px) {
.exercise, .note-large { width: 95%; max-width: 100%; }
.option-row { flex-wrap: wrap; }
.note-small { width: 100%; margin-top: 5px; }
  .promo-text { margin-left: 0; width: 100%; text-align: center; }
  select { max-width: 100%; }
}
</style>
</head>
<body>

<!-- Hình Động Nông Trại Vườn Táo -->
<div class="farm-bg-element floating-apple-1">🍎</div>
<div class="farm-bg-element floating-apple-2">🍏</div>
<div class="farm-bg-element floating-leaf-1">🍃</div>
<div class="farm-bg-element floating-leaf-2">🌿</div>

<header>
  <div class="header-left">
    <a href="https://ketng91.github.io/lopanhthayket_thpt12/">
      <i class="fa-solid fa-apple-whole"></i> Lớp Anh thầy Kết
    </a>
  </div>
  <div class="header-center">🍎 VƯỜN TRẮC NGHIỆM 🍎</div>
</header>

<div class="farm-controls">
  <div class="select-wood-box">
    <i class="fa-solid fa-book-open"></i> Chuyên đề:
    <select id="topicList"></select>
  </div>
  
  <div class="select-wood-box">
    <i class="fa-solid fa-basket-shopping"></i> Chọn Set:
    <select id="setList"></select>
  </div>
</div>

<div id="timerBox">
  ⏱️ Thời gian: <span id="timer">00:00:00</span>
  <button onclick="startTimer()">Bắt đầu</button>
  <button onclick="resetTimer()">Đặt lại</button>
</div>

<div class="exercise" id="exercise"></div>

<textarea class="note-large" placeholder="📝 Ghi chú bài học ..."></textarea>

<footer>🍎 Chăm chỉ gặt hái - Tự tin đỗ đại học! 🍎</footer>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
// =================== DANH SÁCH 30 CHUYÊN ĐỀ GRAMMAR ===================
const rawGrammarTopics = [
  { id: 1, title: "1. Các thì của động từ" },
  { id: 2, title: "2. Sự hòa hợp giữa chủ ngữ và động từ" },
  { id: 3, title: "3. Động từ khuyết thiếu" },
  { id: 4, title: "4. Động từ nguyên mẫu có to và không có to" },
  { id: 5, title: "5. Danh động từ (V-ing)" },
  { id: 6, title: "6. Các động từ theo sau bởi V-ing hoặc to-V" },
  { id: 7, title: "7. Câu bị động" },
  { id: 8, title: "8. Câu điều kiện loại 0, 1, 2, 3 và hỗn hợp" },
  { id: 9, title: "9. Câu ước với wish/if only" },
  { id: 10, title: "10. Câu tường thuật" },
  { id: 11, title: "11. Câu hỏi đuôi" },
  { id: 12, title: "12. Mệnh đề quan hệ" },
  { id: 13, title: "13. Rút gọn mệnh đề quan hệ" },
  { id: 14, title: "14. Mệnh đề trạng ngữ chỉ thời gian, nguyên nhân..." },
  { id: 15, title: "15. Câu chủ động – bị động đặc biệt" },
  { id: 16, title: "16. So sánh bằng, hơn, nhất và so sánh kép" },
  { id: 17, title: "17. Mạo từ a/an/the và zero article" },
  { id: 18, title: "18. Danh từ số ít, số nhiều và lượng từ" },
  { id: 19, title: "19. Đại từ, tính từ sở hữu và đại từ quan hệ" },
  { id: 20, title: "20. Giới từ chỉ thời gian, nơi chốn và phương hướng" },
  { id: 21, title: "21. Liên từ và từ nối" },
  { id: 22, title: "22. Câu đảo ngữ" },
  { id: 23, title: "23. Câu chẻ (cleft sentences)" },
  { id: 24, title: "24. Thức giả định (subjunctive)" },
  { id: 25, title: "25. Cấu trúc song song (parallel structures)" },
  { id: 26, title: "26. Cấu trúc nhấn mạnh và các mẫu câu đặc biệt" },
  { id: 27, title: "27. Trật tự từ trong câu" },
  { id: 28, title: "28. Cấu trúc với too/enough/so/such" },
  { id: 29, title: "29. Cấu trúc nguyên nhân – kết quả và nhượng bộ" },
  { id: 30, title: "30. Cấu trúc với động từ chỉ nhận thức, sai khiến..." }
];

// NGÂN HÀNG CÂU HỎI TRUẨN CHO ĐỦ 30 CHUYÊN ĐỀ
const grammarQuestions = {
  1: [
    { q: "My father _____ coffee every morning before going to work.", options: ["drink", "drinks", "is drinking", "has drunk"], correct: 1, explain: "Thói quen ở hiện tại dùng Hiện tại đơn với S số ít (drinks)." },
    { q: "Listen! Someone _____ at the door.", options: ["knocks", "knocked", "is knocking", "has knocked"], correct: 2, explain: "Dấu hiệu 'Listen!' chỉ hành động đang xảy ra dùng Hiện tại tiếp diễn." },
    { q: "By the time we arrived at the station, the train _____.", options: ["left", "has left", "had left", "was leaving"], correct: 2, explain: "Hành động xảy ra trước mốc quá khứ dùng Quá khứ hoàn thành (had left)." },
    { q: "While I _____ my homework, the power went out.", options: ["do", "did", "was doing", "have done"], correct: 2, explain: "Hành động đang diễn ra trong quá khứ thì có hành động khác cắt ngang." },
    { q: "She _____ in this company for ten years now.", options: ["works", "is working", "has worked", "worked"], correct: 2, explain: "Dấu hiệu 'for ten years now' chỉ sự việc kéo dài đến hiện tại -> Hiện tại hoàn thành." },
    { q: "Look at those dark clouds! It _____ rain soon.", options: ["will", "is going to", "rains", "has rained"], correct: 1, explain: "Dự đoán có căn cứ ở hiện tại dùng 'be going to'." },
    { q: "At 8 p.m. yesterday, we _____ a football match on TV.", options: ["watched", "were watching", "have watched", "are watching"], correct: 1, explain: "Thời điểm xác định trong quá khứ dùng Quá khứ tiếp diễn." },
    { q: "Water _____ at 100 degrees Celsius.", options: ["boils", "boil", "is boiling", "boiled"], correct: 0, explain: "Sự thật hiển nhiên dùng Hiện tại đơn." },
    { q: "I _____ my key. Now I cannot open the door.", options: ["lost", "have lost", "was losing", "had lost"], correct: 1, explain: "Sự việc xảy ra trong quá khứ nhưng để lại kết quả ở hiện tại." },
    { q: "The train _____ at 6 a.m. tomorrow morning.", options: ["leaves", "will leave", "is leaving", "left"], correct: 0, explain: "Lịch trình cố định dùng thì Hiện tại đơn." },
// --- BỔ SUNG SET 2 CHO CHUYÊN ĐỀ 1: CÁC THÌ CỦA ĐỘNG TỪ ---
    { q: "I _____ this movie three times already, but I still enjoy watching it.", options: ["saw", "have seen", "am seeing", "see"], correct: 1, explain: "Dấu hiệu 'already' và số lần lặp lại trải nghiệm tính đến hiện tại dùng thì Hiện tại hoàn thành." },
    { q: "Yesterday, she _____ home late because of the heavy traffic jam.", options: ["comes", "came", "has come", "was coming"], correct: 1, explain: "Dấu hiệu 'Yesterday' chỉ thời điểm xác định trong quá khứ, dùng thì Quá khứ đơn." },
    { q: "They _____ in this seaside city for ten years now.", options: ["lived", "are living", "have lived", "will live"], correct: 2, explain: "Dấu hiệu 'for + khoảng thời gian + now' diễn tả hành động kéo dài từ quá khứ đến hiện tại -> Hiện tại hoàn thành." },
    { q: "We _____ a picnic next Sunday. We have already bought all the food and drinks.", options: ["have", "will have", "are going to have", "had"], correct: 2, explain: "Kế hoạch cho tương lai đã được chuẩn bị trước (đã mua đồ ăn) dùng Tương lai gần (be going to V)." },
    { q: "She _____ her room keys. She cannot find them anywhere right now.", options: ["lost", "has lost", "is losing", "had lost"], correct: 1, explain: "Sự việc xảy ra trong quá khứ nhưng để lại kết quả ở hiện tại (bây giờ không tìm thấy) -> Hiện tại hoàn thành." },
    { q: "The sun _____ in the East and sets in the West.", options: ["rise", "rises", "rose", "is rising"], correct: 1, explain: "Diễn tả một sự thật hiển nhiên, chân lý khoa học dùng thì Hiện tại đơn với chủ ngữ số ít (rises)." },
    { q: "My mother _____ the living room at the moment.", options: ["cleans", "is cleaning", "has cleaned", "cleaned"], correct: 1, explain: "Dấu hiệu 'at the moment' báo hiệu hành động đang diễn ra tại thời điểm nói -> Hiện tại tiếp diễn." },
    { q: "We _____ each other since we were students at high school.", options: ["know", "knew", "have known", "are knowing"], correct: 2, explain: "Cấu trúc: S + have/has V3 + since + S + V2. Động từ 'know' không chia tiếp diễn." },
    { q: "Last week, I _____ to the city zoo with my family.", options: ["go", "went", "have gone", "was going"], correct: 1, explain: "Dấu hiệu 'Last week' chỉ sự việc xảy ra và kết thúc trong quá khứ -> Quá khứ đơn." },
    { q: "Hurry up! The school bus _____.", options: ["comes", "is coming", "come", "will come"], correct: 1, explain: "Mệnh lệnh 'Hurry up!' báo hiệu sự việc đang diễn ra tiến lại gần -> Hiện tại tiếp diễn." },
  ],
  2: [
    { q: "Each of the students _____ responsible for their own desk.", options: ["is", "are", "be", "were"], correct: 0, explain: "Cấu trúc 'Each of + N số nhiều' đi với động từ số ít." },
    { q: "Neither my parents nor my brother _____ coming tonight.", options: ["is", "are", "be", "were"], correct: 0, explain: "Nối bằng 'Neither... nor...', động từ chia theo chủ ngữ gần nhất (my brother)." },
    { q: "The news about the accident _____ very shocking.", options: ["was", "were", "are", "have been"], correct: 0, explain: "'News' là danh từ không đếm được, dùng động từ số ít." },
    { q: "Ten dollars _____ all I have in my pocket.", options: ["is", "are", "were", "be"], correct: 0, explain: "Số tiền tệ làm chủ ngữ chia động từ số ít." },
    { q: "The number of applicants _____ increased significantly this year.", options: ["has", "have", "are", "were"], correct: 0, explain: "'The number of + N số nhiều' chia động từ số ít." },
    { q: "A number of students _____ playing in the yard.", options: ["are", "is", "was", "has been"], correct: 0, explain: "'A number of + N số nhiều' chia động từ số nhiều." },
    { q: "Physics _____ my favorite subject when I was at high school.", options: ["was", "were", "is", "are"], correct: 0, explain: "Tên môn học có 's' vẫn chia số ít." },
    { q: "The cattle _____ grazing peacefully in the meadow.", options: ["are", "is", "was", "has been"], correct: 0, explain: "'Cattle' (gia súc) luôn chia động từ số nhiều." },
    { q: "Every boy and girl _____ to wear a uniform.", options: ["has", "have", "are having", "were having"], correct: 0, explain: "Có 'Every' đi kèm danh từ thì động từ chia số ít." },
    { q: "Collecting stamps _____ my brother's main hobby.", options: ["is", "are", "were", "be"], correct: 0, explain: "Danh động từ (V-ing) làm chủ ngữ chia số ít." }
  ],

// =================== XỬ LÝ CHIA SET BÀI TẬP (10 CÂU/SET) ===================
const setsData = {};

function buildSetsData() {
  let globalSetId = 1;
  rawGrammarTopics.forEach(topic => {
    const qList = grammarQuestions[topic.id] || [];
    const questionsPerSet = 10;
    const totalSets = Math.max(1, Math.ceil(qList.length / questionsPerSet));

    for (let s = 0; s < totalSets; s++) {
      const start = s * questionsPerSet;
      const end = Math.min(start + questionsPerSet, qList.length);
      const setQs = qList.slice(start, end);

      setsData[globalSetId] = {
        topicId: topic.id,
        topicTitle: topic.title,
        setName: `Set ${s + 1} (${setQs.length} câu)`,
        questions: setQs
      };
      globalSetId++;
    }
  });
}

buildSetsData();

// =================== LOGIC CHƯƠNG TRÌNH ===================
let currentSetId = 1;
let currentQIndex = 0;
let userAnswers = {}; 
let isSubmitted = false;

function buildDropdowns() {
  const topicSelect = document.getElementById("topicList");
  topicSelect.innerHTML = "";

  rawGrammarTopics.forEach(t => {
    const opt = document.createElement("option");
    opt.value = t.id;
    opt.textContent = t.title;
    topicSelect.appendChild(opt);
  });

  updateSetDropdown(topicSelect.value);
}

function updateSetDropdown(topicId) {
  const setSelect = document.getElementById("setList");
  setSelect.innerHTML = "";

  Object.keys(setsData).forEach(setId => {
    if (setsData[setId].topicId == topicId) {
      const opt = document.createElement("option");
      opt.value = setId;
      opt.textContent = setsData[setId].setName;
      setSelect.appendChild(opt);
    }
  });

  if (setSelect.options.length > 0) {
    loadSet(Number(setSelect.value));
  }
}

function loadSet(setId) {
  currentSetId = setId;
  currentQIndex = 0;
  userAnswers = {};
  isSubmitted = false;
  renderQuestion();
}

function selectAnswer(qIndex, optionIndex) {
  if (isSubmitted) return;
  userAnswers[qIndex] = optionIndex;
}

function renderQuestion() {
  const area = document.getElementById("exercise");
  const setData = setsData[currentSetId];

  if (!setData || !setData.questions.length) {
    area.innerHTML = "<p style='text-align:center;'>Chưa có dữ liệu cho Set này!</p>";
    return;
  }

  if (isSubmitted) {
    renderScoreCard();
    return;
  }

  const qObj = setData.questions[currentQIndex];
  const selected = userAnswers[currentQIndex];

  let html = `
    <div class="question-block">
      <div class="set-badge-header">
        <span>🍎 ${setData.topicTitle}</span>
        <span>${setData.setName} | Câu ${currentQIndex + 1}/${setData.questions.length}</span>
      </div>

      <div class="question-box">${qObj.q}</div>

      ${qObj.options.map((opt, i) => `
        <div class="option-row">
          <input type="radio" 
                 name="q_opt" 
                 id="opt_${i}" 
                 value="${i}" 
                 ${selected === i ? 'checked' : ''} 
                 onclick="selectAnswer(${currentQIndex}, ${i})">
          <label for="opt_${i}">${String.fromCharCode(65 + i)}. ${opt}</label>
          <textarea class="note-small" placeholder="Ghi chú..."></textarea>
        </div>
      `).join("")}

      <div class="exercise-buttons">
        <button class="btn-back" onclick="prevQuestion()" ${currentQIndex === 0 ? 'disabled style="opacity:0.5;cursor:default;"' : ''}>⬅ Câu trước</button>
        <button class="btn-next" onclick="nextQuestion()">${currentQIndex === setData.questions.length - 1 ? 'Xem lại các câu ➔' : 'Câu tiếp ➔'}</button>
        <button class="btn-submit" onclick="submitTest()">Nộp Bài 🏆</button>
        <span class="promo-text">Luyện thi THPTQG thầy Kết</span>
      </div>
    </div>
  `;

  area.innerHTML = html;
}

function nextQuestion() {
  const setData = setsData[currentSetId];
  if (currentQIndex < setData.questions.length - 1) {
    currentQIndex++;
    renderQuestion();
  } else {
    alert("Bạn đã ở câu cuối cùng! Hãy kiểm tra lại bài và nhấn 'Nộp Bài' nhé.");
  }
}

function prevQuestion() {
  if (currentQIndex > 0) {
    currentQIndex--;
    renderQuestion();
  }
}

function submitTest() {
  const setData = setsData[currentSetId];
  const total = setData.questions.length;
  const answeredCount = Object.keys(userAnswers).length;

  if (answeredCount < total) {
    if (!confirm(`Bạn mới làm ${answeredCount}/${total} câu. Bạn có chắc chắn muốn nộp bài không?`)) {
      return;
    }
  }

  isSubmitted = true;
  fireConfetti();
  renderScoreCard();
}

function renderScoreCard() {
  const area = document.getElementById("exercise");
  const setData = setsData[currentSetId];
  const total = setData.questions.length;

  let correctCount = 0;
  setData.questions.forEach((q, idx) => {
    if (userAnswers[idx] === q.correct) {
      correctCount++;
    }
  });

  let html = `
    <div class="score-card">
      <h2>🎉 TỔNG KẾT BÀI LÀM 🎉</h2>
      <p style="font-size: 18px; font-weight: 700; color: var(--text-dark);">${setData.topicTitle} - ${setData.setName}</p>
      <div class="score-number">${correctCount} / ${total}</div>
      <p style="font-size: 18px; font-weight: 700; color: #2e7d32;">
        ${correctCount === total ? "Xuất sắc! Bạn đã đạt điểm tuyệt đối 🎯" : "Cố gắng ôn tập kỹ các câu sai bên dưới nhé!"}
      </p>
      <div style="margin-top: 25px;">
        <button class="btn-next" onclick="reviewMode()" style="padding: 12px 28px; font-size: 18px;">🔍 Xem Chi Tiết Câu Đúng / Sai</button>
        <button class="btn-submit" onclick="loadSet(currentSetId)" style="padding: 12px 28px; font-size: 18px; margin-left: 10px;">Làm Lại Set Này 🔄</button>
      </div>
    </div>
  `;

  area.innerHTML = html;
}

function reviewMode() {
  const area = document.getElementById("exercise");
  const setData = setsData[currentSetId];

  let html = `<h2 style="text-align:center; color: var(--apple-red); font-size: 26px; font-weight: 900; margin-bottom: 20px;">
    📋 CHI TIẾT ĐÁP ÁN & GIẢI THÍCH
  </h2>`;

  setData.questions.forEach((qObj, qIdx) => {
    const userChoice = userAnswers[qIdx];
    const isCorrect = userChoice === qObj.correct;

    html += `
      <div class="question-block" style="margin-bottom: 25px;">
        <div class="set-badge-header" style="background: ${isCorrect ? '#e8f5e9' : '#ffebee'}; color: ${isCorrect ? '#2e7d32' : '#c62828'};">
          <span>Câu ${qIdx + 1}</span>
          <span>${isCorrect ? 'Chính xác ✔️' : 'Chưa đúng ❌'}</span>
        </div>

        <div class="question-box">${qObj.q}</div>

        ${qObj.options.map((opt, optIdx) => {
          let rowClass = "";
          if (optIdx === qObj.correct) rowClass = "correct-choice";
          else if (optIdx === userChoice && !isCorrect) rowClass = "wrong-choice";

          return `
            <div class="option-row ${rowClass}">
              <input type="radio" disabled ${userChoice === optIdx ? 'checked' : ''}>
              <label>${String.fromCharCode(65 + optIdx)}. ${opt}</label>
            </div>
          `;
        }).join("")}

        <div class="review-explanation">
          💡 <strong>Giải thích chi tiết:</strong> ${qObj.explain}
        </div>
      </div>
    `;
  });

  html += `
    <div style="text-align:center; margin-top: 20px;">
      <button class="btn-submit" onclick="loadSet(currentSetId)" style="padding: 14px 32px; font-size: 18px;">Làm Lại Bài Này 🔄</button>
    </div>
  `;

  area.innerHTML = html;
}

// =================== TIMER ===================
let timerInterval = null;
let secondsPassed = 0;

function formatTime(s) {
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return [h, m, sec].map(v => v.toString().padStart(2, '0')).join(':');
}

function startTimer() {
  if (!timerInterval) {
    timerInterval = setInterval(() => {
      secondsPassed++;
      document.getElementById("timer").textContent = formatTime(secondsPassed);
    }, 1000);
  }
}

function resetTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
  secondsPassed = 0;
  document.getElementById("timer").textContent = "00:00:00";
}

function fireConfetti() {
  confetti({ particleCount: 180, spread: 90, origin: { y: 0.6 } });
}

// =================== KHỞI TẠO ===================
buildDropdowns();

document.getElementById("topicList").addEventListener("change", function () {
  updateSetDropdown(this.value);
  resetTimer();
});

document.getElementById("setList").addEventListener("change", function () {
  loadSet(Number(this.value));
  resetTimer();
});
</script>
